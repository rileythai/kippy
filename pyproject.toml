[project]
name = "kippy"
version = "0.1.0"
description = "Interactive Kippenhahn diagram viewer for MESA, KEPLER and MONASH stellar evolution output"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER", "giza/COPYING", "giza/COPYING.LESSER"]
authors = [
    { name = "Riley Thai", email = "riley.thai@monash.edu" },
    { name = "Alexander Heger", email = "alexander.heger@monash.edu" },
]
requires-python = ">=3.10"
dependencies = []
keywords = ["kippenhahn", "stellar evolution", "astrophysics", "mesa", "kepler", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Fortran",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://kippy.rileythai.com"
Documentation = "https://kippy.rileythai.com"
Source = "https://github.com/rileythai/kippy"
Issues = "https://github.com/rileythai/kippy/issues"

[project.scripts]
convview = "kippy._cli:convview"
convdump = "kippy._cli:convdump"

[build-system]
requires = ["meson-python>=0.18.0", "meson>=1.1.0", "ninja"]
build-backend = "mesonpy"

[dependency-groups]
docs = ["zensical>=0.0.68; python_version >= '3.11'"]
# build backend tools are kept in the project venv so the meson-python editable
# rebuild hook resolves a persistent ninja path instead of a temporary uv build env
dev = ["meson-python>=0.18.0", "meson>=1.1.0", "ninja"]

[tool.uv]
# this forces build against the venv tools above, rather than a temporary isolated
# env. you can't use temps otherwise the ninja path vanishes after install
no-build-isolation-package = ["kippy"]

[tool.cibuildwheel]
build = "cp*-manylinux_*"
skip = "cp31?t-*"
before-all = "dnf install -y cairo-devel libX11-devel freetype-devel"

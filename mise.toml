[tasks.install]
description = "rebuild kippy into .venv as an editable install (fortran edits then rebuild on import)"
run = "uv sync --reinstall-package kippy"

[tasks.smoke]
description = "render a synthetic .kipp headless with the installed kippy"
run = "env -u DISPLAY uv run tools/smoke_test.py"

[tasks."docs:serve"]
description = "preview the docs site locally"
depends = ["docs:fortran"]
run = "uvx --from 'zensical>=0.0.68' zensical serve"

[tasks."docs:build"]
description = "build the static docs site into site/"
depends = ["docs:fortran"]
run = "uvx --from 'zensical>=0.0.68' zensical build"

[tasks."docs:fortran"]
description = "build the fortran api docs with ford into docs/fortran, which zensical copies to site/fortran"
run = ["uvx --from 'ford>=7.0.13' ford tools/ford.md", "sh tools/ford_backlink.sh docs/fortran"]

[tasks.doccheck]
description = "fail on fortran modules, procedures, arguments or module variables without a ford !! docstring"
run = "uv run tools/doccheck.py"
